name: rfdetr

channels:
  - conda-forge

variables:
  PYTORCH_ENABLE_MPS_FALLBACK: "1"

dependencies:
  # Core Python
  - python=3.11
  - pip

  # RF-DETR core dependencies.
  - pytorch=2.10
  - torchvision=0.25
  - pycocotools=2.0.11

  # Jupyter notebook support.
  - ipykernel
  - ipywidgets
  - jupytext
  - nbconvert
  - notebook

  # Editable object_ctrl base requirements and notebook support.
  - setuptools>=69
  - wheel
  - numpy>=2.2,<2.4
  - pandas>=2.3,<3
  - matplotlib
  - pillow
  - pyyaml
  - requests
  - tqdm

  - pip:
    - opencv-python-headless
    - rfdetr[onnx,train]==1.10.1
    - roboflow==1.4.2
    - supervision==0.30.2
